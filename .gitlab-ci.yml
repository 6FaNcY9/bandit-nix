# GitLab CI/CD pipeline for bandit-nix
# Ported from .github/workflows/ with GitLab-native features.
#
# Prerequisites:
#   - $CACHIX_CACHE_NAME  — name of your Cachix cache (plain variable)
#   - $CACHIX_AUTH_TOKEN  — Cachix auth token (masked variable)
# Note on build-system: Building the full NixOS closure (~10GB+) exceeds the
# disk limit of GitLab shared runners. The build-system job uses
# --dry-run to validate the derivation graph without downloading/building
# everything. For a full build, trigger the populate-cache job manually
# from CI/CD > Pipelines > Run pipeline. Run it multiple times to
# gradually fill the cache until build-system can do a full build.

# ---------------------------------------------------------------------------
# Workflow rules — prevent duplicate pipelines on push + open MR.
# Only one pipeline runs per commit: MR pipeline takes priority over branch.
# ---------------------------------------------------------------------------
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
default:
  # nixos/nix is the standard image for running Nix commands in CI.
  image: nixos/nix@sha256:bf1d938835ab96312f098fa6c2e9cab367728e0aad0646ee3e02a787c80d8fb8
  before_script:
    # Enable flakes and configure the binary cache substituters.
    # cachix use adds the cache's substituter + trusted public key automatically.
    - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
    - echo "substituters = https://cache.nixos.org" >> /etc/nix/nix.conf
    - echo "trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" >> /etc/nix/nix.conf
    - nix --version

# ---------------------------------------------------------------------------
# Stages
# ---------------------------------------------------------------------------
stages:
  - lint      # Pinned formatting, static analysis, and installer checks
  - build     # Flake validation + dry-run derivation check
  - test      # Enforced vulnerability scan
  - cache     # Manual job to populate Cachix cache on x86_64 runners

# ---------------------------------------------------------------------------
# Reusable rule sets
# ---------------------------------------------------------------------------

# Runs on every push/MR pipeline (not on scheduled pipelines).
.rules-push-and-mr:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# STAGE: lint
# ---------------------------------------------------------------------------

# Runs all repository checks with tools pinned by flake.lock.
repository-checks:
  extends: .rules-push-and-mr
  stage: lint
  script:
    - nix flake check --no-update-lock-file

# ---------------------------------------------------------------------------
# STAGE: build
# ---------------------------------------------------------------------------

# Validates every public derivation graph without building or downloading
# the closure. This catches Nix evaluation errors (bad module options,
# missing references, type errors) without hitting disk space limits.
build-system:
  extends: .rules-push-and-mr
  stage: build
  script:
    - |
      for target in \
        .#nixosConfigurations.bandit.config.system.build.toplevel \
        .#nixosConfigurations.bandit-ci.config.system.build.toplevel \
        .#nixosConfigurations.bandit-lab.config.system.build.toplevel \
        .#homeConfigurations.vino.activationPackage
      do
        nix build "$target" --dry-run --no-update-lock-file
      done

# ---------------------------------------------------------------------------
# STAGE: test
# ---------------------------------------------------------------------------

# Scans the CI-safe laptop closure and fails for findings that are not in the
# reviewed, expiring allowlist.
security-scan:
  extends: .rules-push-and-mr
  stage: test
  script:
    - nix build .#nixosConfigurations.bandit-ci.config.system.build.toplevel --no-update-lock-file --fallback
    - |
      set +e
      nix run .#vulnix -- \
        --closure \
        --whitelist ci/vulnix-whitelist.toml \
        --json \
        ./result > vulnix-report.json
      status=$?
      test -s vulnix-report.json || echo '[]' > vulnix-report.json
      exit "$status"
  artifacts:
    name: vulnix-report
    paths:
      - vulnix-report.json
    expire_in: 1 week
    when: always

# ---------------------------------------------------------------------------
# STAGE: cache
# ---------------------------------------------------------------------------

# Manually triggered job to build the full NixOS closure on GitLab's
# x86_64 runners and push all derivations to Cachix.
# Run this multiple times from CI/CD > Pipelines > Run pipeline until
# the cache is fully populated. Once populated, build-system can be
# switched back to a full build.
#
# --keep-going ensures partial builds are pushed to Cachix even if
# some derivations fail due to disk space limits, so each run makes
# progress and eventually the full closure is cached.
populate-cache:
  stage: cache
  # when: manual — only runs when you explicitly trigger it from the UI.
  # This prevents it from running on every push and wasting CI minutes.
  when: manual
  # allow_failure: true — disk space may still be hit on some runs;
  # whatever was built before the failure is still pushed to Cachix.
  allow_failure: true
  script:
    - nix profile install .#cachix --no-update-lock-file
    - cachix use "${CACHIX_CACHE_NAME}"
    - cachix authtoken "${CACHIX_AUTH_TOKEN}"
    - |
      nix build .#nixosConfigurations.bandit.config.system.build.toplevel \
        --print-build-logs \
        --out-link result \
        --no-update-lock-file \
        --keep-going \
        --fallback \
        --max-jobs 1 \
        --cores 2
      nix path-info --recursive ./result | cachix push "${CACHIX_CACHE_NAME}"
    - echo "✅ Pushed whatever was built to Cachix — run again if needed"
