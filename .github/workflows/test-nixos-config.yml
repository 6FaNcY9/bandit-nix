name: Test NixOS Configuration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 6am UTC

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@f133a0d95090ef2609192b4a21f54e20af819ea9 # v6

  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Check NixOS Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Check flake
        run: nix flake check --no-update-lock-file

      - name: Evaluate NixOS configuration
        run: |
          nix build .#nixosConfigurations.bandit-ci.config.system.build.toplevel \
            --dry-run \
            --no-update-lock-file \
            --fallback

      - name: Confirm configuration evaluation
        if: success()
        run: |
          echo "✅ NixOS configuration evaluated successfully!"

  build-vm:
    name: Build and Test VM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build VM
        run: |
          nix build .#nixosConfigurations.bandit-ci.config.system.build.vm \
            --print-build-logs \
            --no-update-lock-file \
            --fallback

      - name: Test VM boots
        timeout-minutes: 5
        env:
          QEMU_OPTS: -nographic
        run: |
          timeout 90s result/bin/run-bandit-vm > /tmp/vm-boot.log 2>&1 &
          VM_PID=$!
          trap 'kill "$VM_PID" 2>/dev/null || true' EXIT

          for _ in {1..18}; do
            sleep 5
            if grep -qE "login:|Startup finished" /tmp/vm-boot.log 2>/dev/null; then
              echo "✅ VM reached login prompt"
              exit 0
            fi
            if grep -qE "Kernel panic|kernel BUG at|OOPS:" /tmp/vm-boot.log 2>/dev/null; then
              echo "❌ VM kernel panic detected"
              tail -50 /tmp/vm-boot.log
              exit 1
            fi
            if ! kill -0 "$VM_PID" 2>/dev/null; then
              echo "❌ VM exited before reaching the login prompt"
              tail -50 /tmp/vm-boot.log
              exit 1
            fi
          done

          echo "❌ VM did not reach login prompt within 90s"
          tail -50 /tmp/vm-boot.log
          exit 1

  populate-cache:
    name: Populate Cachix binary cache
    runs-on: ubuntu-latest
    # Runs on every push to main (and manually). Builds the bandit-lab
    # closure — the host that auto-applies hourly — and pushes it to the
    # github-bandit-nix Cachix cache so the lab substitutes instead of
    # compiling. Requires the CACHIX_AUTH_TOKEN repository secret
    # (Settings > Secrets and variables > Actions).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # The cachix substituter makes repeated runs incremental: paths
          # pushed by earlier runs are substituted instead of rebuilt.
          extra-conf: |
            substituters = https://cache.nixos.org https://github-bandit-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= github-bandit-nix.cachix.org-1:iaqre/ibQyXnNT8oRzHQHJ4UQfzvGAaFooRXs8v+Hks=

      - name: Install cachix CLI
        run: nix profile install nixpkgs#cachix

      - name: Authenticate to Cachix
        run: cachix authtoken "${CACHIX_AUTH_TOKEN}"

      - name: Build bandit-lab closure
        run: |
          nix build .#nixosConfigurations.bandit-lab.config.system.build.toplevel \
            --print-build-logs \
            --out-link result \
            --no-update-lock-file \
            --keep-going \
            --fallback \
            --max-jobs 1 \
            --cores 2

      - name: Push closure to Cachix
        run: nix path-info --recursive ./result | cachix push github-bandit-nix

  update-flake:
    name: Update flake.lock
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake inputs
        run: nix flake update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          commit-message: "chore: update flake.lock"
          title: "chore: update flake inputs"
          branch: update-flake-lock
          body: "Automated flake.lock update"
