name: Test NixOS Configuration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 6am UTC

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@f133a0d95090ef2609192b4a21f54e20af819ea9 # v6

  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Check and Build NixOS Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Check flake
        run: nix flake check --no-update-lock-file

      - name: Build NixOS configuration
        run: |
          nix build .#nixosConfigurations.bandit-ci.config.system.build.toplevel \
            --print-build-logs \
            --no-update-lock-file \
            --fallback

      - name: Show build result
        if: success()
        run: |
          echo "✅ NixOS configuration built successfully!"
          nix path-info .#nixosConfigurations.bandit-ci.config.system.build.toplevel

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Build for scanning
        run: |
          nix build .#nixosConfigurations.bandit-ci.config.system.build.toplevel \
            --no-update-lock-file \
            --fallback

      - name: Scan for unapproved vulnerabilities
        run: |
          for attempt in 1 2 3; do
            set +e
            nix run .#vulnix -- \
              --closure \
              --whitelist ci/vulnix-whitelist.toml \
              --json \
              ./result > vulnix-report.json
            status=$?
            set -e

            # A valid report means the scan completed. Preserve vulnix's
            # status so genuine, unapproved findings still fail the job.
            if python3 -m json.tool vulnix-report.json >/dev/null 2>&1; then
              exit "$status"
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Vulnerability database download failed; retrying ($attempt/3)..."
              sleep $((attempt * 10))
            fi
          done

          echo "[]" > vulnix-report.json
          exit "$status"

      - name: Show vulnerability summary
        if: always()
        run: |
          COUNT=$(python3 -c "import json; print(len(json.load(open('vulnix-report.json'))))" 2>/dev/null || echo "unknown")
          echo "Vulnerabilities found: $COUNT"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vulnix-report
          path: vulnix-report.json

  build-vm:
    name: Build and Test VM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build VM
        run: |
          nix build .#nixosConfigurations.bandit-ci.config.system.build.vm \
            --print-build-logs \
            --no-update-lock-file \
            --fallback

      - name: Test VM boots
        timeout-minutes: 5
        env:
          QEMU_OPTS: -nographic
        run: |
          timeout 90s result/bin/run-bandit-vm > /tmp/vm-boot.log 2>&1 &
          VM_PID=$!
          trap 'kill "$VM_PID" 2>/dev/null || true' EXIT

          for _ in {1..18}; do
            sleep 5
            if grep -qE "login:|Startup finished" /tmp/vm-boot.log 2>/dev/null; then
              echo "✅ VM reached login prompt"
              exit 0
            fi
            if grep -qE "Kernel panic|kernel BUG at|OOPS:" /tmp/vm-boot.log 2>/dev/null; then
              echo "❌ VM kernel panic detected"
              tail -50 /tmp/vm-boot.log
              exit 1
            fi
            if ! kill -0 "$VM_PID" 2>/dev/null; then
              echo "❌ VM exited before reaching the login prompt"
              tail -50 /tmp/vm-boot.log
              exit 1
            fi
          done

          echo "❌ VM did not reach login prompt within 90s"
          tail -50 /tmp/vm-boot.log
          exit 1

  update-flake:
    name: Update flake.lock
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake inputs
        run: nix flake update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          commit-message: "chore: update flake.lock"
          title: "chore: update flake inputs"
          branch: update-flake-lock
          body: "Automated flake.lock update"
