<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gedächtnis</title>
<style>
  :root { --bg:#f6f3ea; --fg:#1d1b16; --dim:#6b655a; --card:#fffdf7; --line:#d8d1c0; --acc:#b4541a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16140f; --fg:#ece6d6; --dim:#9a927f; --card:#201d16; --line:#3a352a; --acc:#f0a35e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.6 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; margin:0 12px 0 0; }
  button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; }
  button[aria-pressed=true] { border-color:var(--acc); color:var(--acc); font-weight:600; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin:0 0 14px; }
  .card h2 { margin:0 0 4px; font-size:22px; }
  .dim { color:var(--dim); font-size:15px; }
  a, .link { color:var(--acc); cursor:pointer; text-decoration:underline; background:none; border:0; padding:0; font:inherit; }
  ul { padding-left:22px; margin:6px 0; }
  pre { overflow:auto; background:var(--bg); padding:10px; border-radius:8px; }
  code { font-size:.9em; }
  svg { width:100%; height:70vh; background:var(--card); border:1px solid var(--line); border-radius:12px; touch-action:none; }
  svg text { fill:var(--fg); font-size:12px; pointer-events:none; }
  svg line { stroke:var(--line); }
  svg circle { cursor:pointer; }
</style>
<header>
  <h1>Gedächtnis</h1>
  <button data-view="projects">Projekte</button>
  <button data-view="notes">Notizen</button>
  <button data-view="map">Karte</button>
  <span class="dim" id="status"></span>
</header>
<main id="main">Lade Notizen …</main>
<script>
// shortcut: loads every note into the browser, fine for some hundred notes; give the lab an index endpoint when it gets slow.
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let notes = [], view = ['notes', 'map'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'projects';

async function walk(dir) {
  const res = await fetch('/notes/' + dir, {headers: {Accept: 'application/json'}});
  if (!res.ok) throw new Error('Speicher antwortet nicht (' + res.status + ')');
  const out = [];
  for (const e of await res.json()) {
    const name = e.name.replace(/\/$/, '');
    if (name.startsWith('.') || name === 'inbox') continue;
    if (e.is_dir) out.push(...await walk(dir + name + '/'));
    else if (name.endsWith('.md')) out.push({path: dir + name, changed: e.mod_time});
  }
  return out;
}

function parse(n, text) {
  const m = /^---\n([\s\S]*?)\n---\n?/.exec(text);
  const fm = m ? m[1] : '';
  n.body = m ? text.slice(m[0].length) : text;
  n.title = (/^title:\s*(.+)$/m.exec(fm) || [])[1] || n.path.replace(/\.md$/, '');
  n.type = (/^type:\s*(.+)$/m.exec(fm) || [])[1] || 'note';
  n.tags = [...fm.matchAll(/^- (.+)$/gm)].map((x) => x[1]);
  n.links = [...n.body.matchAll(/\[\[([^\]]+)\]\]/g)].map((x) => x[1]);
  n.slug = n.path.replace(/\.md$/, '').split('/').pop();
  // Session notes are named <day>-<device>-<project>-<id> and tagged session, device, project.
  if (n.type === 'session') { n.day = n.slug.slice(0, 10); n.device = n.tags[1] || '?'; n.project = n.tags[2] || '?'; }
}
const section = (n, name) => ((new RegExp('^## ' + name + '\\n([\\s\\S]*?)(?=^## |\\Z)', 'm').exec(n.body + '\n## ') || [])[1] || '').trim();
const bullets = (t) => t.split('\n').filter((l) => /^\s*[-*] /.test(l)).map((l) => l.replace(/^\s*[-*] /, ''));

// Small Markdown renderer: everything is escaped first, so note text can never inject HTML.
function md(src) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[\[([^\]]+)\]\]/g, (_, t) => `<button class="link" data-open="${t}">${t}</button>`);
  let html = '', list = false, code = false;
  for (const line of src.split('\n')) {
    if (line.startsWith('```')) { html += code ? '</pre>' : (list ? '</ul>' : '') + '<pre>'; code = !code; list = false; continue; }
    if (code) { html += esc(line) + '\n'; continue; }
    const li = /^\s*[-*] (.*)/.exec(line), h = /^(#{1,4}) (.*)/.exec(line);
    if (li) { html += (list ? '' : '<ul>') + '<li>' + inline(li[1]) + '</li>'; list = true; continue; }
    if (list) { html += '</ul>'; list = false; }
    if (h) html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (line.trim()) html += '<p>' + inline(line) + '</p>';
  }
  return html + (list ? '</ul>' : '') + (code ? '</pre>' : '');
}
const find = (name) => notes.find((n) => n.slug === name || n.title === name || n.path === name);
const open = (n) => `<button class="link" data-open="${esc(n.path)}">${esc(n.title)}</button>`;

function projects() {
  const by = {};
  for (const n of notes) {
    if (n.type === 'session') (by[n.project] ||= {sessions: []}).sessions.push(n);
    else if (n.path.startsWith('projects/')) (by[n.slug] ||= {sessions: []}).note = n;
  }
  const cards = Object.entries(by).map(([name, p]) => {
    p.sessions.sort((a, b) => b.day.localeCompare(a.day) || b.changed.localeCompare(a.changed));
    const last = p.sessions[0];
    return {name, p, last, when: last ? last.day : (p.note.changed || '').slice(0, 10)};
  }).sort((a, b) => b.when.localeCompare(a.when));
  if (!cards.length) return '<p>Noch keine Projekte. Sie erscheinen nach der ersten gespeicherten Sitzung.</p>';
  return cards.map(({name, p, last, when}) => {
    const openItems = last ? bullets(section(last, 'Open')) : [];
    const devices = [...new Set(p.sessions.map((s) => s.device))].join(', ');
    return `<div class="card"><h2>${esc(name)}</h2>
      <div class="dim">Zuletzt: ${esc(when)}${devices ? ' · Geräte: ' + esc(devices) : ''}${p.note ? ' · ' + open(p.note).replace(/>[^<]*</, '>Projekt-Notiz<') : ''}</div>
      ${last ? '<p><b>Ziel:</b> ' + esc(section(last, 'Goal').replace(/^[-*] /gm, '').split('\n')[0] || '') + '</p>' : ''}
      ${openItems.length ? '<b>Offen:</b><ul>' + openItems.map((b) => '<li>' + esc(b) + '</li>').join('') + '</ul>' : ''}
      ${p.sessions.length ? '<details><summary>' + p.sessions.length + ' Sitzung(en)</summary><ul>' +
        p.sessions.map((s) => `<li>${esc(s.day)} · ${esc(s.device)} · ${open(s).replace(/>[^<]*</, '>ansehen<')}</li>`).join('') + '</ul></details>' : ''}
    </div>`;
  }).join('');
}

function list() {
  const groups = {};
  for (const n of notes) (groups[n.path.includes('/') ? n.path.split('/')[0] : 'allgemein'] ||= []).push(n);
  return Object.entries(groups).sort().map(([g, ns]) => `<div class="card"><h2>${esc(g)}</h2><ul>` +
    ns.sort((a, b) => b.changed.localeCompare(a.changed)).map((n) => `<li>${open(n)} <span class="dim">${esc(n.changed.slice(0, 10))}</span></li>`).join('') + '</ul></div>').join('');
}

function map() {
  // Nodes are notes plus link targets that have no note yet; edges are [[links]] and session -> project.
  const nodes = new Map(), edges = [];
  const node = (id, note) => nodes.get(id) || nodes.set(id, {id, note, x: Math.random() * 800 + 100, y: Math.random() * 500 + 50, vx: 0, vy: 0}).get(id);
  for (const n of notes) node(n.slug, n);
  for (const n of notes) for (const t of [...n.links, ...(n.project ? [n.project] : [])]) {
    const target = find(t);
    edges.push([node(n.slug, n), node(target ? target.slug : t, target)]);
  }
  const all = [...nodes.values()];
  for (let i = 0; i < 300; i++) { // plain force layout: push apart, pull along edges, drift to the middle
    for (const a of all) for (const b of all) if (a !== b) {
      const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 1;
      a.vx += dx / d2 * 900; a.vy += dy / d2 * 900;
    }
    for (const [a, b] of edges) { const dx = b.x - a.x, dy = b.y - a.y; a.vx += dx * .01; a.vy += dy * .01; b.vx -= dx * .01; b.vy -= dy * .01; }
    for (const a of all) { a.vx += (500 - a.x) * .002; a.vy += (300 - a.y) * .002; a.x += a.vx *= .6; a.y += a.vy *= .6; }
  }
  const xs = all.map((a) => a.x), ys = all.map((a) => a.y);
  const box = [Math.min(...xs) - 60, Math.min(...ys) - 30, Math.max(...xs) - Math.min(...xs) + 160, Math.max(...ys) - Math.min(...ys) + 60];
  const color = (a) => !a.note ? 'var(--dim)' : a.note.type === 'session' ? 'var(--line)' : 'var(--acc)';
  return `<p class="dim">Orange: Notizen · Hell: Sitzungen · Grau: verlinkt, aber noch ohne Notiz. Antippen öffnet die Notiz.</p>
    <svg viewBox="${box.join(' ')}">` + edges.map(([a, b]) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`).join('') +
    all.map((a) => `<circle ${a.note ? `data-open="${esc(a.note.path)}"` : ''} cx="${a.x}" cy="${a.y}" r="${a.note && a.note.type !== 'session' ? 9 : 5}" fill="${color(a)}"/>` +
      (a.note && a.note.type === 'session' ? '' : `<text x="${a.x + 12}" y="${a.y + 4}">${esc(a.id)}</text>`)).join('') + '</svg>';
}

function show(n) {
  $('#main').innerHTML = `<p><button data-view="${view}">← zurück</button></p><div class="card"><h2>${esc(n.title)}</h2>
    <div class="dim">${esc(n.path)} · geändert ${esc(n.changed.slice(0, 16).replace('T', ' '))}</div>${md(n.body)}</div>`;
}
function render() {
  document.querySelectorAll('header button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === view));
  $('#main').innerHTML = {projects, notes: list, map}[view]();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-view],[data-open]');
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; location.hash = view; render(); }
  else { const n = find(t.dataset.open); if (n) show(n); }
});
(async () => {
  try {
    notes = await walk('');
    await Promise.all(notes.map(async (n) => parse(n, await (await fetch('/notes/' + n.path)).text())));
    $('#status').textContent = notes.length + ' Notizen';
    render();
  } catch (e) { $('#main').textContent = 'Fehler: ' + e.message; }
})();
</script>
</html>
