<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mcbots</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1d20; --mut:#6b7280; --card:#f4f5f7; --bd:#d6d9de; --ok:#16a34a; --bad:#dc2626; --acc:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#e6e8eb; --mut:#9aa1ab; --card:#1d2025; --bd:#2f343b; --acc:#60a5fa; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; }
  h1 { font-size:18px; margin:0 0 12px; }
  .bar,.card { background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:12px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card h2 { font-size:15px; margin:0 0 6px; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .on .dot { background:var(--ok); }
  .mut { color:var(--mut); } .err { color:var(--bad); word-break:break-word; }
  form { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
  input,select,button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:4px 8px; }
  input[type=number] { width:70px; } input.w { width:110px; }
  button { cursor:pointer; background:var(--acc); color:#fff; border-color:var(--acc); }
  button.stop { background:var(--bad); border-color:var(--bad); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #msg { margin-left:8px; }
  canvas { width:100%; max-width:640px; height:auto; aspect-ratio:1; background:var(--bg); border:1px solid var(--bd); border-radius:6px; display:block; margin-top:8px; touch-action:none; }
</style>
</head>
<body>
<h1>mcbots <span id="conn" class="mut"></span></h1>
<div class="bar">
  <div class="row"><b>Target</b>
    <select id="target"></select>
    <label>your player name <input id="me" class="w" maxlength="16"></label>
    <label title="A new job replaces the running one and the queue instead of waiting behind them"><input type="checkbox" id="replace" checked> replace current jobs</label>
    <button class="stop" data-job="stop">Stop</button><span id="msg" class="mut"></span>
  </div>
  <form data-job="goto">goto <input name="x" type="number" placeholder="x" required><input name="y" type="number" placeholder="y" required><input name="z" type="number" placeholder="z" required><button>Go</button></form>
  <form data-job="follow">follow <input name="player" class="w" placeholder="player" required><button>Follow</button> <button type="button" data-job="come">Come to me</button></form>
  <form data-job="mine">mine <input name="block" class="w" placeholder="iron_ore" required><input name="count" type="number" value="8" min="1"><button>Mine</button></form>
  <form data-job="chop">chop logs <input name="count" type="number" value="8" min="1"><button>Chop</button></form>
  <form data-job="deposit">deposit into chest <input name="x" type="number" placeholder="x" required><input name="y" type="number" placeholder="y" required><input name="z" type="number" placeholder="z" required><button>Deposit</button></form>
  <form data-job="rearm">re-arm from chest <input name="x" type="number" placeholder="x" required><input name="y" type="number" placeholder="y" required><input name="z" type="number" placeholder="z" required><button>Re-arm</button></form>
  <form data-job="say">say <input name="text" placeholder="text" maxlength="200" required><button>Say</button></form>
</div>
<div class="bar">
  <div class="row"><b>Map</b> centre <select id="centre"></select>
    <label>zoom <input id="zoom" type="range" min="-2" max="3" step="0.25" value="0"></label>
    <span id="mapinfo" class="mut"></span></div>
  <canvas id="radar" width="640" height="640"></canvas>
  <div class="mut">green = bots, blue = players (BlueMap), red = hostile mobs, yellow = chests/ores, hatched = protected areas</div>
</div>
<div id="bots" class="grid"></div>
<script>
let last = { bots: [], world: { players: [], mobs: [], blocks: [], bluemap: {} }, protectedAreas: [] };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
try { $('me').value = localStorage.getItem('me') || ''; } catch {}
$('me').oninput = () => { try { localStorage.setItem('me', $('me').value); } catch {} };

async function send(type, args) {
  const t = $('target').value;
  const r = await fetch('/api/job', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bots: t === 'all' ? 'all' : [t], type, args, replace: $('replace').checked }) });
  const j = await r.json();
  $('msg').textContent = r.ok ? 'sent' : j.error;
  $('msg').className = r.ok ? 'mut' : 'err';
}
document.querySelectorAll('form').forEach((f) => f.onsubmit = (e) => {
  e.preventDefault();
  send(f.dataset.job, Object.fromEntries(new FormData(f)));
});
document.querySelectorAll('button[data-job]').forEach((b) => b.onclick = () =>
  send(b.dataset.job, b.dataset.job === 'come' ? { player: $('me').value } : {}));

function render(bots) {
  const sel = $('target'), cur = sel.value;
  const names = ['all', ...bots.map((b) => b.name)];
  if (names.join() !== [...sel.options].map((o) => o.value).join()) {
    sel.replaceChildren(...names.map((n) => new Option(n, n)));
    sel.value = names.includes(cur) ? cur : 'all';
  }
  $('bots').replaceChildren(...bots.map((b) => {
    const c = el('div', 'card' + (b.online ? ' on' : ''));
    const h = el('h2'); h.append(el('span', 'dot'), b.name, el('span', 'mut', b.online ? 'online' : 'offline'));
    c.append(h);
    if (b.online) {
      c.append(el('div', '', `health ${Math.round(b.health)}/20  food ${b.food}/20`));
      c.append(el('div', '', `pos ${b.pos ? b.pos.join(' ') : '?'}  ${b.dimension || ''}`));
    }
    c.append(el('div', '', 'job: ' + (b.job ? `${b.job.label} ${b.job.progress || ''}` : 'idle')));
    if (b.queue.length) c.append(el('div', 'mut', 'queue: ' + b.queue.join(' | ')));
    c.append(el('div', 'mut', 'inv: ' + (b.inventory.join(', ') || 'empty') + (b.inventoryKinds > b.inventory.length ? ', ...' : '')));
    if (b.lastError) c.append(el('div', 'err', 'error: ' + b.lastError));
    return c;
  }));
}
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { $('conn').textContent = ''; };
  ws.onmessage = (e) => { const m = JSON.parse(e.data); last = m; render(m.bots); radar(); };
  ws.onclose = () => { $('conn').textContent = '(reconnecting...)'; setTimeout(connect, 2000); };
}

// ---- radar: top-down, north up (-z), centred on a bot or player ----
const cv = $('radar'), g = cv.getContext('2d');
$('zoom').oninput = radar;
cv.onwheel = (e) => { e.preventDefault(); const z = $('zoom'); z.value = +z.value + (e.deltaY < 0 ? 0.25 : -0.25); radar(); };
function radar() {
  const { bots, world, protectedAreas } = last;
  const sel = $('centre'), cur = sel.value;
  const names = [...bots.map((b) => b.name), ...world.players.filter((p) => !bots.some((b) => b.name === p.name)).map((p) => p.name)];
  if (names.join() !== [...sel.options].map((o) => o.value).join()) {
    sel.replaceChildren(...names.map((n) => new Option(n, n)));
    sel.value = names.includes(cur) ? cur : (names[0] || '');
  }
  const bot = bots.find((b) => b.name === sel.value && b.pos);
  const pl = world.players.find((p) => p.name === sel.value);
  const c = bot ? { x: bot.pos[0], z: bot.pos[2], dim: bot.dimension } : pl ? { x: pl.x, z: pl.z, dim: pl.dim } : null;
  const W = cv.width, H = cv.height;
  const css = getComputedStyle(document.body);
  g.clearRect(0, 0, W, H);
  g.fillStyle = css.backgroundColor; g.fillRect(0, 0, W, H);
  const bm = world.bluemap;
  $('mapinfo').textContent = c ? `${c.dim} @ ${Math.round(c.x)} ${Math.round(c.z)}  | BlueMap: ` + (!bm.enabled ? 'off' : bm.ok ? 'ok' : 'unavailable (' + bm.error + ')') : 'nothing to centre on';
  if (!c) return;
  const k = 2 * Math.pow(2, +$('zoom').value); // pixels per block
  const px = (x) => W / 2 + (x - c.x) * k, pz = (z) => H / 2 + (z - c.z) * k;
  g.strokeStyle = css.getPropertyValue('--bd'); g.fillStyle = css.getPropertyValue('--mut'); g.font = '12px system-ui';
  g.lineWidth = 1;
  const step = [16, 32, 64, 128, 256, 512, 1024].find((s) => s * k >= 48) || 1024; // grid, in blocks
  for (let x = Math.ceil((c.x - W / 2 / k) / step) * step; px(x) < W; x += step) { g.beginPath(); g.moveTo(px(x), 0); g.lineTo(px(x), H); g.stroke(); g.fillText(x, px(x) + 2, 10); }
  for (let z = Math.ceil((c.z - H / 2 / k) / step) * step; pz(z) < H; z += step) { g.beginPath(); g.moveTo(0, pz(z)); g.lineTo(W, pz(z)); g.stroke(); g.fillText(z, 2, pz(z) - 2); }
  // protected areas apply to every dimension's x/z, drawn only in the overworld
  if (c.dim === 'overworld') for (const [x1, z1, x2, z2] of protectedAreas) {
    g.fillStyle = 'rgba(220,38,38,0.12)'; g.strokeStyle = '#dc2626';
    g.fillRect(px(x1), pz(z1), (x2 - x1) * k, (z2 - z1) * k); g.strokeRect(px(x1), pz(z1), (x2 - x1) * k, (z2 - z1) * k);
  }
  const dot = (x, z, r, col, label) => { g.fillStyle = col; g.beginPath(); g.arc(px(x), pz(z), r, 0, 7); g.fill(); if (label) { g.fillStyle = css.color; g.fillText(label, px(x) + r + 2, pz(z) + 4); } };
  for (const b of world.blocks) if (b.dim === c.dim) dot(b.x, b.z, 3, '#eab308');
  for (const m of world.mobs) if (m.dim === c.dim) { g.globalAlpha = Math.max(0.3, 1 - m.age / 30); dot(m.x, m.z, 4, '#dc2626', k >= 2 ? m.type : ''); g.globalAlpha = 1; }
  for (const p of world.players) if (p.dim === c.dim && !bots.some((b) => b.name === p.name)) dot(p.x, p.z, 5, '#2563eb', p.name);
  for (const b of bots) if (b.pos && b.dimension === c.dim) dot(b.pos[0], b.pos[2], 5, '#16a34a', b.name);
}
connect();
</script>
</body>
</html>
