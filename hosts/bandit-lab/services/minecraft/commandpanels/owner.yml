    name: '&cOwner weapons'
    left-click:
      commands:
        - '[console] give %player_name% minecraft:netherite_sword[custom_name="Owner Blade",unbreakable={},enchantments={sharpness:255,looting:10,fire_aspect:10,sweeping_edge:10,unbreaking:255,mending:1}]'
