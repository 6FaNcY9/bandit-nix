title: '&8Owner'
type: inventory
command: owner
conditions: '%player_name% $HASPERM bandit.owner'
rows: 3
layout:
  10:
    - armor
  11:
    - weapons
  12:
    - tools
  14:
    - buffs
  15:
    - nobuffs
  16:
    - all
items:
  armor:
    material: NETHERITE_CHESTPLATE
    name: '&bOwner armor'
    left-click:
      commands:
        - '[console] give %player_name% minecraft:netherite_helmet[custom_name="Owner Helm",unbreakable={},enchantments={protection:255,unbreaking:255,mending:1,respiration:255,aqua_affinity:1,thorns:10}]'
        - '[console] give %player_name% minecraft:netherite_chestplate[custom_name="Owner Chestplate",unbreakable={},enchantments={protection:255,unbreaking:255,mending:1,thorns:10}]'
        - '[console] give %player_name% minecraft:netherite_leggings[custom_name="Owner Leggings",unbreakable={},enchantments={protection:255,unbreaking:255,mending:1,swift_sneak:5}]'
        - '[console] give %player_name% minecraft:netherite_boots[custom_name="Owner Boots",unbreakable={},enchantments={protection:255,unbreaking:255,mending:1,feather_falling:255,depth_strider:5,soul_speed:5}]'
        - '[console] give %player_name% minecraft:elytra[custom_name="Owner Wings",unbreakable={},enchantments={unbreaking:255,mending:1}]'
        - '[console] give %player_name% minecraft:shield[custom_name="Owner Shield",unbreakable={},enchantments={unbreaking:255,mending:1}]'
        - '[msg] &aAdded.'
    right-click:
      commands:
        - '[console] give %player_name% minecraft:shulker_box[custom_name="Owner armor",container=[{slot:0,item:{id:"minecraft:netherite_helmet",count:1,components:{custom_name:"Owner Helm",unbreakable:{},enchantments:{protection:255,unbreaking:255,mending:1,respiration:255,aqua_affinity:1,thorns:10}}}},{slot:1,item:{id:"minecraft:netherite_chestplate",count:1,components:{custom_name:"Owner Chestplate",unbreakable:{},enchantments:{protection:255,unbreaking:255,mending:1,thorns:10}}}},{slot:2,item:{id:"minecraft:netherite_leggings",count:1,components:{custom_name:"Owner Leggings",unbreakable:{},enchantments:{protection:255,unbreaking:255,mending:1,swift_sneak:5}}}},{slot:3,item:{id:"minecraft:netherite_boots",count:1,components:{custom_name:"Owner Boots",unbreakable:{},enchantments:{protection:255,unbreaking:255,mending:1,feather_falling:255,depth_strider:5,soul_speed:5}}}},{slot:4,item:{id:"minecraft:elytra",count:1,components:{custom_name:"Owner Wings",unbreakable:{},enchantments:{unbreaking:255,mending:1}}}},{slot:5,item:{id:"minecraft:shield",count:1,components:{custom_name:"Owner Shield",unbreakable:{},enchantments:{unbreaking:255,mending:1}}}}]]'
