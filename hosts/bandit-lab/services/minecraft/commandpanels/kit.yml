        - '[console] give %player_name% minecraft:elytra[enchantments={unbreaking:3,mending:1}]'
        - '[console] give %player_name% minecraft:totem_of_undying'
        - '[console] give %player_name% minecraft:shield[enchantments={unbreaking:3,mending:1}]'
        - '[msg] &aKit added to your inventory.'
    right-click:
      commands:
        - '[console] give %player_name% minecraft:shulker_box[custom_name="Armor kit",container=[{slot:0,item:{id:"minecraft:netherite_helmet",count:1,components:{enchantments={protection:4,unbreaking:3,mending:1,respiration:3,aqua_affinity:1}}}},{slot:1,item:{id:"minecraft:netherite_chestplate",count:1,components:{enchantments={protection:4,unbreaking:3,mending:1}}}},{slot:2,item:{id:"minecraft:netherite_leggings",count:1,components:{enchantments={protection:4,unbreaking:3,mending:1}}}},{slot:3,item:{id:"minecraft:netherite_boots",count:1,components:{enchantments={protection:4,unbreaking:3,mending:1,feather_falling:4,depth_strider:3}}}},{slot:4,item:{id:"minecraft:elytra",count:1,components:{enchantments={unbreaking:3,mending:1}}}},{slot:5,item:{id:"minecraft:totem_of_undying",count:1}},{slot:6,item:{id:"minecraft:shield",count:1,components:{enchantments={unbreaking:3,mending:1}}}}]]'
