title: '&8Survival kit'
type: inventory
command: kit
conditions: '%player_name% $HASPERM bandit.admin.menu'
rows: 3
layout:
  10:
    - armor
  12:
    - weapons
  14:
    - tools
  16:
    - supplies
  22:
    - full
items:
  armor:
    material: NETHERITE_CHESTPLATE
    name: '&bArmor set'
    left-click:
      commands:
        - '[console] give %player_name% minecraft:netherite_helmet[enchantments={protection:4,unbreaking:3,mending:1,respiration:3,aqua_affinity:1}]'
        - '[console] give %player_name% minecraft:netherite_chestplate[enchantments={protection:4,unbreaking:3,mending:1}]'
        - '[console] give %player_name% minecraft:netherite_leggings[enchantments={protection:4,unbreaking:3,mending:1}]'
