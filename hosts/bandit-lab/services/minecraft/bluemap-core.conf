# Seeded once by minecraft-stage when BlueMap has no core.conf yet; BlueMap and
# its operator own the file afterwards.
# accept-download: BlueMap fetches Mojang's client jar (textures only) from
# piston-data.mojang.com; the server already runs under EULA=TRUE.
accept-download: true
data: "bluemap"
render-thread-count: 1
scan-for-mod-resources: false
metrics: false
