modules:
  http_wan:
    prober: http
    timeout: 10s
    http:
      # Access redirects establish public reachability, not origin health.
      valid_status_codes: [200, 302, 303]
      follow_redirects: false
      preferred_ip_protocol: ip4
  http_origin:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
